[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nse-data-mcp"
version = "0.1.0"
description = "MCP server for NSE prices, financials, ownership, corporate filings and deals"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1,<1.0",
    "httpx2>=2.5,<3.0",
    "mcp>=2.0,<3.0",
    "pypdf>=6.0,<7.0",
]

[project.scripts]
nse-data-mcp = "nse_data_mcp.server:main"

[project.optional-dependencies]
dev = [
    "mcp[cli]>=2.0,<3.0",
    "pytest>=8.0,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nse_data_mcp"]

# ``include`` only filters files inside ``packages``, so the top-level
# compatibility modules must be force-included to reach the wheel.
[tool.hatch.build.targets.wheel.force-include]
"mcp_server.py" = "mcp_server.py"
"olhc_ltp_data_utils.py" = "olhc_ltp_data_utils.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
